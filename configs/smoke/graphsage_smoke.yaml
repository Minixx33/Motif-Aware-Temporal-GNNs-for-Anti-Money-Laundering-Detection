model:
  name: GraphSAGE
  hidden_dim: 128
  num_layers: 2
  aggregator: mean
  dropout: 0.2
training:
  device: cuda
  batch_size: 8192
  eval_batch_size: 16384
  lr: 0.0001
  weight_decay: 0.0001
  epochs: 1
  early_stopping_patience: 1
  gradient_clip: 1.0
  optimizer:
    type: adam
    betas:
    - 0.9
    - 0.999
    eps: 1e-8
loss:
  type: bce
  pos_weight: null
